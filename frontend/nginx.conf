server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self';" always;

    # Re-resolve the backend through Docker's DNS instead of pinning the IP seen
    # at startup, so recreating the backend container can't leave nginx stale.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream http://backend:3001;

    # Proxy API calls to backend (internal Docker network — backend port not exposed to host)
    location /api/ {
        proxy_pass $backend_upstream;
        proxy_read_timeout 150s;  # survey analysis can take a while on big houses
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Wi-Fi survey agent AppImage + manifest. No SPA fallback: a missing file is a 404.
    location /downloads/ {
        try_files $uri =404;
    }

    # Serve physical tool files (e.g. /tools/manual-j.html); fall back to SPA for /tools route
    location /tools/ {
        try_files $uri /index.html;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}

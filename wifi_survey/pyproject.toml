[project]
name = "wifi-survey"
version = "0.1.1"
description = "Wi-Fi survey & AP placement for home-planner (laptop agent + analysis)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "rich>=13.7",
    "typer>=0.12",
]

[project.optional-dependencies]
# Model fitting, placement, heatmaps and the report (Phases 3-7). The laptop
# only needs the core install to run `doctor` and the measurement agent.
analysis = [
    "jinja2>=3.1",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "scipy>=1.13",
    "shapely>=2.0",
]

[project.scripts]
wifi-survey = "wifi_survey.cli:app"

[dependency-groups]
dev = [
    "pyright>=1.1.380",
    "pytest>=8.2",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/wifi_survey"]

[tool.hatch.build.targets.wheel.force-include]
# Default configs ship inside the package so the AppImage works outside a checkout.
"config" = "wifi_survey/_config"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
strict = ["src/wifi_survey/floorplan", "src/wifi_survey/model"]
